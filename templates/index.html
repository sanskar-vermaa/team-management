<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Management</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9;
    color: #1f2328;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e5e9;
    border-radius: 10px;
    padding: 32px;
    width: 100%;
    max-width: 460px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input[type="file"], input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #1f2937;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #111827; }
  .flash {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Team Composition Builder</h1>
    <p class="sub">Upload a roster and get teams split across Dev, BA and DA.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/upload" method="post" enctype="multipart/form-data">
      <div class="field">
        <label for="file">Excel file</label>
        <input id="file" type="file" name="file" accept=".xlsx,.xls" required>
        <div class="hint">Needs Dev, BA and DA columns.</div>
      </div>
      <div class="field">
        <label for="dev_size">Devs per team</label>
        <input id="dev_size" type="number" name="dev_size" value="3" min="1" max="10">
      </div>
      <button type="submit">Generate teams</button>
    </form>
  </div>
</body>
</html>
