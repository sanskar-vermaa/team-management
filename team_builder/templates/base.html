<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Split a roster spreadsheet into balanced teams and export them as PDF, Excel or CSV.">
  <title>{% block title %}Team Builder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main class="page {% block page_class %}{% endblock %}">
    <header class="site">
      <a class="brand" href="{{ url_for('web.index') }}">Team Builder</a>
      <nav>
        <a href="{{ url_for('web.sample_roster') }}">Sample roster</a>
      </nav>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category if category in ['error', 'warning'] else 'error' }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

    <footer>Team Builder v{{ app_version }}</footer>
  </main>
</body>
</html>
