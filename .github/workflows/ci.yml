name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=team_builder --cov-report=term-missing --cov-fail-under=95

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t team-builder:ci .
      - name: Refuses to start without SECRET_KEY
        run: |
          if docker run --rm team-builder:ci python -c "import app"; then
            echo "expected a failure without SECRET_KEY"; exit 1
          fi
      - name: Serves the app
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=ci-secret-key team-builder:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q "Build teams from a roster"
          curl -fs -X POST localhost:8000/api/teams -H 'Content-Type: application/json' \
            -d '{"roster":{"Dev":["a","b"],"QA":["c"]},"composition":{"Dev":2,"QA":1}}' | grep -q '"team_count":1'
